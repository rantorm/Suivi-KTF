<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17633f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kanton'ny Fanantenana">
<meta name="description" content="Pilotage des activités — Kanton'ny Fanantenana">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Kanton'ny Fanantenana — Pilotage</title>
<style>
:root{--bg:#f4f1e9;--surface:#fffdf8;--surface2:#f8f6f0;--ink:#18342a;--ink2:#315044;--muted:#718078;--line:#dfe5de;--green:#17633f;--greenSoft:#e8f2ec;--gold:#b58a20;--goldSoft:#fbf3d9;--red:#b95648;--redSoft:#f8e9e6;--blue:#3d7180;--purple:#6b4c9a;--shadow:0 8px 24px rgba(24,52,42,.08);--r:14px;--tap:44px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}button{touch-action:manipulation;cursor:pointer}
.container{width:min(1080px,100%);margin:auto;padding:12px 14px 20px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.logo h1{font-family:Georgia,serif;color:var(--green);font-size:clamp(1.2rem,3.5vw,1.7rem);line-height:1.15}
.logo p{color:var(--muted);font-size:.78rem;margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.73rem;font-weight:800;margin-bottom:8px}
.badge{min-height:30px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.68rem;font-weight:800}
.badge.live{background:var(--greenSoft);border-color:#b8d7c4;color:var(--green)}
.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.alert{padding:10px 12px;border:1px solid;border-radius:11px;background:var(--surface);font-size:.78rem}
.alert strong{display:block}.alert small{color:var(--muted)}
.danger{background:var(--redSoft);border-color:#e8c0b9}.danger strong{color:var(--red)}
.warning{background:var(--goldSoft);border-color:#ead9a5}.warning strong{color:#80600d}
.info{background:var(--greenSoft);border-color:#c4decf}.info strong{color:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.btn{min-height:var(--tap);padding:8px 12px;border:1px solid #cbd6cd;border-radius:10px;background:var(--surface);color:var(--ink);font-size:.73rem;font-weight:800}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.gold{background:var(--goldSoft);border-color:#dfca88;color:#76590d}
.btn.dangerBtn{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.kpi.gold:before{background:var(--gold)}.kpi.red:before{background:var(--red)}.kpi.blue:before{background:var(--blue)}
.klabel{font-size:.58rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800}
.kvalue{font-size:1.45rem;font-weight:900;line-height:1.1;margin:3px 0 1px}
.ksub{font-size:.6rem;color:var(--muted)}
.section-title{font-size:.92rem;margin:14px 0 8px;font-weight:800}
.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:3px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.66rem;font-weight:800;color:var(--muted)}
.filter.active{background:var(--green);border-color:var(--green);color:#fff}
.card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:7px;cursor:pointer}
.card.today{border-color:#d3aa43}.card.overdue{border-color:#dfaaa2}
.card.soon{border-color:#e0b947;background:linear-gradient(135deg,#fffdf8,#fbf6e8)}
.card.cancelled{opacity:.55}
.date{text-align:center}.date b{display:block;font-size:1.2rem;line-height:1}
.date span{display:block;color:var(--muted);font-size:.55rem;text-transform:uppercase}
.date em{font-style:normal;color:var(--gold);font-size:.52rem;font-weight:800}
.phase{display:inline-block;padding:2px 6px;border-radius:99px;font-size:.52rem;font-weight:800;text-transform:uppercase;margin-bottom:2px}
.title{font-size:.85rem;font-weight:800;margin-bottom:2px}
.desc{font-size:.7rem;color:var(--muted);margin-bottom:4px}
.meta{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:2px 6px;border:1px solid #e7ebe6;border-radius:5px;background:var(--surface2);color:var(--muted);font-size:.55rem;font-weight:700}
.chip.crit{background:var(--redSoft);color:var(--red)}.chip.high{background:var(--goldSoft);color:#80600d}
.chip.done{background:var(--greenSoft);color:var(--green)}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:.9rem}
.iconbtn.done{background:var(--green);color:#fff;border-color:var(--green)}
.camp-card,.pole-card{display:flex;gap:11px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer}
.camp-color,.pole-color{width:5px;border-radius:99px;flex-shrink:0}
.camp-body h3,.pole-card h3{font-size:.95rem;font-weight:800;margin-bottom:2px}
.camp-meta{font-size:.7rem;color:var(--muted);margin-bottom:5px}
.camp-stats{display:flex;gap:6px;flex-wrap:wrap}
.camp-stat{font-size:.62rem;font-weight:750;padding:2px 6px;border-radius:5px;background:var(--surface2)}
.camp-stat.done{background:var(--greenSoft);color:var(--green)}.camp-stat.over{background:var(--redSoft);color:var(--red)}
.empty{text-align:center;padding:28px 14px;color:var(--muted);font-size:.82rem}.empty h3{color:var(--ink);margin-bottom:5px}
.progress{background:var(--ink);color:#fff;border-radius:var(--r);padding:12px;margin-bottom:12px}
.phead{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;margin-bottom:7px}.phead b{color:#e7c96b}
.track{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#2b9660,#e0b947);transition:.3s}
.cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{min-height:30px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:750}
.cal .head{background:transparent;color:var(--muted);font-size:.52rem}.cal .empty{background:transparent}
.cal .has{border:1px solid #cbded1}.cal .today{box-shadow:inset 0 0 0 2px #d3aa43}
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -3px 16px rgba(24,52,42,.06)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px;border:none;background:transparent;color:var(--muted);font-size:.58rem;font-weight:800;min-width:52px}
.nav-item.active{color:var(--green)}.nav-item span{font-size:1.1rem}
.modal{position:fixed;inset:0;background:rgba(9,29,21,.5);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:1000}
.modal.open{display:flex}
.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet h2{font-size:1rem;margin-bottom:2px}.sheet>p{font-size:.7rem;color:var(--muted);margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{display:flex;flex-direction:column;gap:3px}.field.full{grid-column:1/-1}
.field label{font-size:.62rem;font-weight:800;color:var(--ink2)}
.field input,.field textarea,.field select{width:100%;min-height:42px;border:1px solid #cbd6cd;border-radius:9px;background:#fff;padding:7px 9px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.poles-check{display:flex;flex-wrap:wrap;gap:5px}
.poles-check label{display:flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);font-size:.68rem;font-weight:700}
.poles-check input{width:15px;height:15px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.modalactions .btn{width:100%}
.toast{position:fixed;z-index:2000;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 13px;font-size:.7rem;font-weight:800;transition:.2s;pointer-events:none;max-width:calc(100vw - 20px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.view{display:none}.view.active{display:block}
.resp-list{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.resp-item{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;font-size:.82rem;font-weight:700}
@media(min-width:720px){body{padding-bottom:16px}.nav-bottom{display:none}.modal{align-items:center;padding:18px}.sheet{border-radius:18px;max-height:88vh}.modalactions{display:flex;justify-content:flex-end}.modalactions .btn{width:auto}}
@media(max-width:719px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
SEE_LOCAL_FILE_FOR_FULL_CONTENT
</div>
</body>
</html>
